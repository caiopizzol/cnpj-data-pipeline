[project]
name = "cnpj-data-pipeline"
version = "1.38.5"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "polars>=1.0.0,<2.0.0",
    "pyarrow>=17.0.0,<24.0.0",
]

[project.scripts]
cnpj-pipeline = "main:main"

[tool.setuptools]
py-modules = ["file_types", "config", "database", "downloader", "processor", "parquet_writer", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 94
precision = 2
include_namespace_packages = true

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright==1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
