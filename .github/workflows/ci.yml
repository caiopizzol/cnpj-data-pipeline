name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cnpj
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      - name: Typecheck
        run: uv run --frozen pyright

      - name: Test with coverage
        run: uv run --frozen pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t cnpj-recovery:ci .

      - name: Test Docker recovery
        run: CNPJ_TEST_IMAGE=cnpj-recovery:ci uv run --frozen pytest tests/test_docker_recovery.py

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build ARM64 Docker image
        run: docker build --platform linux/arm64 -t cnpj-recovery:arm64 .

      - name: Test ARM64 Docker recovery
        run: CNPJ_TEST_IMAGE=cnpj-recovery:arm64 CNPJ_TEST_PLATFORM=linux/arm64 uv run --frozen pytest tests/test_docker_recovery.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
